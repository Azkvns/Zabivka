services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zabivka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabivka
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabivka -d zabivka"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
