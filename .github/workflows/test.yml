name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zabivka
          POSTGRES_PASSWORD: zabivka_ci
          POSTGRES_DB: zabivka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zabivka -d zabivka"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://zabivka:zabivka_ci@127.0.0.1:5432/zabivka
      JWT_SECRET: ci-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt pytest-cov
      - name: Run pytest
        run: python -m pytest --cov=app --cov-report=xml
        working-directory: backend
      - name: Upload coverage
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: backend/coverage.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build client
        run: npm ci && npm run build
        working-directory: frontend
